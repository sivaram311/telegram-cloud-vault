<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Cloud Vault - Fast Stream & Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #0b1329; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navbar { background: #131f37; border-bottom: 1px solid #1e293b; }
        .card { background: #131f37; border: 1px solid #1e293b; transition: transform 0.2s, box-shadow 0.2s; border-radius: 10px; overflow: hidden; position: relative; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,0.6); border-color: #38bdf8; }
        .media-thumb { height: 180px; object-fit: cover; width: 100%; cursor: pointer; background: #070d1e; }
        .video-overlay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 0.8rem; pointer-events: none; }
        .video-placeholder { height: 180px; display: flex; align-items: center; justify-content: center; background: #070d1e; color: #38bdf8; font-size: 3rem; cursor: pointer; }
        .modal-content { background: #0b1329; border: 1px solid #1e293b; color: #f8fafc; }
        .stat-card { background: #131f37; border: 1px solid #1e293b; border-radius: 8px; padding: 12px 18px; }
        .badge-live { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #0284c7; }
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 2rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand mb-0 h1 d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock-fill text-info fs-4"></i>
            <span>Encrypted Telegram Vault</span>
        </span>
        <div class="d-flex align-items-center gap-2">
            <span class="badge badge-live px-3 py-2 rounded-pill">
                <i class="bi bi-lightning-charge-fill text-warning"></i> 15 GB VHDX Cache Active
            </span>
            <span class="badge bg-secondary px-3 py-2 rounded-pill">
                <i class="bi bi-google"></i> 5 TiB Crypt Remote
            </span>
            <a href="/logout" class="btn btn-outline-danger btn-sm rounded-pill ms-2">
                <i class="bi bi-box-arrow-right"></i> Sign out
            </a>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <!-- Live Metrics Dashboard -->
    <div class="row g-3 mb-4 text-center">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="text-secondary small">Total Chats Discovered</div>
                <div class="fs-4 fw-bold text-info" id="stat-chats">-</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="text-secondary small">Messages Indexed</div>
                <div class="fs-4 fw-bold text-light" id="stat-msgs">-</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="text-secondary small">Media Synced (Encrypted)</div>
                <div class="fs-4 fw-bold text-success" id="stat-synced">-</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="text-secondary small">Pending Downloads</div>
                <div class="fs-4 fw-bold text-warning" id="stat-pending">-</div>
            </div>
        </div>
    </div>

    <!-- Search & Filters -->
    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-search"></i></span>
                <input type="text" id="searchInput" class="form-control bg-dark text-light border-secondary" placeholder="Search captions, filenames, senders...">
            </div>
        </div>
        <div class="col-md-4">
            <button class="btn btn-outline-info w-100" onclick="goToPage(1)"><i class="bi bi-arrow-clockwise"></i> Search / Refresh</button>
        </div>
    </div>

    <!-- Media Grid -->
    <div class="row g-4" id="media-grid">
        <div class="col-12 text-center py-5 text-secondary">
            <div class="spinner-border text-info mb-3" role="status"></div>
            <div>Loading fast thumbnail gallery from T:\ cache...</div>
        </div>
    </div>

    <!-- Pagination Controls -->
    <div class="pagination-container" id="paginationBar">
    </div>
</div>

<!-- Modal Player -->
<div class="modal fade" id="playerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-xl">
        <div class="modal-content">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="playerTitle">Decrypted Stream Preview</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body text-center p-0" id="playerBody" style="background: #000; min-height: 450px; display:flex; align-items:center; justify-content:center;">
            </div>
            <div class="modal-footer border-secondary justify-content-between">
                <div class="text-secondary small" id="playerMeta"></div>
                <a id="playerDownloadBtn" class="btn btn-outline-info btn-sm" target="_blank">
                    <i class="bi bi-box-arrow-up-right"></i> Direct Stream
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const modal = new bootstrap.Modal(document.getElementById('playerModal'));
    let currentPage = 1;

    async function loadStats() {
        try {
            const res = await fetch('/api/stats');
            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }
            const data = await res.json();
            document.getElementById('stat-chats').innerText = data.total_chats || 0;
            document.getElementById('stat-msgs').innerText = data.total_messages || 0;
            document.getElementById('stat-synced').innerText = data.synced_media || 0;
            document.getElementById('stat-pending').innerText = data.pending_media || 0;
        } catch(e) {}
    }

    async function loadMedia(page = 1) {
        currentPage = page;
        const grid = document.getElementById('media-grid');
        const query = document.getElementById('searchInput').value.trim();
        let url = `/api/media?page=${page}&limit=30`;
        if (query) url += `&search=${encodeURIComponent(query)}`;

        try {
            const res = await fetch(url);
            if (res.status === 401) {
                window.location.href = '/login';
                return;
            }
            const data = await res.json();
            const items = data.items || [];
            const pag = data.pagination || {};

            if (!items.length) {
                grid.innerHTML = '<div class="col-12 text-center py-5 text-secondary">No media found matching query.</div>';
                document.getElementById('paginationBar').innerHTML = '';
                return;
            }

            grid.innerHTML = items.map((m) => {
                const streamUrl = m.stream_url;
                const thumbSrc = m.thumbnail_url || streamUrl;
                let preview = '';
                
                if (m.type === 'video') {
                    if (m.thumbnail_url) {
                        preview = `
                        <div style="position:relative;">
                            <img src="${m.thumbnail_url}" class="media-thumb" loading="lazy" onclick="openPlayer('${encodeURIComponent(JSON.stringify(m))}')">
                            <span class="video-overlay"><i class="bi bi-play-fill"></i> Video</span>
                        </div>`;
                    } else {
                        preview = `<div class="video-placeholder" onclick="openPlayer('${encodeURIComponent(JSON.stringify(m))}')"><i class="bi bi-play-circle"></i></div>`;
                    }
                } else if (m.type === 'image') {
                    preview = `<img src="${thumbSrc}" class="media-thumb" loading="lazy" onclick="openPlayer('${encodeURIComponent(JSON.stringify(m))}')">`;
                } else {
                    preview = `<div class="video-placeholder" onclick="openPlayer('${encodeURIComponent(JSON.stringify(m))}')"><i class="bi bi-file-earmark-music"></i></div>`;
                }

                return `
                <div class="col-sm-6 col-md-4 col-lg-3">
                    <div class="card h-100">
                        ${preview}
                        <div class="card-body p-3">
                            <div class="text-truncate fw-medium mb-1" title="${m.filename}">${m.filename}</div>
                            <div class="text-secondary small d-flex justify-content-between mb-2">
                                <span class="badge bg-dark border border-secondary text-info">${m.type.toUpperCase()}</span>
                                <span class="text-truncate" style="max-width:120px;">${m.chat}</span>
                            </div>
                            <div class="text-muted small text-truncate">${m.caption || 'No caption'}</div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            renderPagination(pag);
            window.scrollTo({ top: 0, behavior: 'smooth' });

        } catch (e) {
            grid.innerHTML = `<div class="col-12 text-center py-5 text-danger">Error loading vault catalog: ${e.message}</div>`;
        }
    }

    function renderPagination(pag) {
        const bar = document.getElementById('paginationBar');
        if (!pag || pag.total_pages <= 1) {
            bar.innerHTML = '';
            return;
        }

        let html = '';
        html += `<button class="btn btn-outline-secondary btn-sm" ${!pag.has_prev ? 'disabled' : ''} onclick="goToPage(${pag.page - 1})"><i class="bi bi-chevron-left"></i> Previous</button>`;
        html += `<span class="text-secondary small px-3">Page <strong>${pag.page}</strong> of <strong>${pag.total_pages}</strong> (${pag.total_items} items)</span>`;
        html += `<button class="btn btn-outline-secondary btn-sm" ${!pag.has_next ? 'disabled' : ''} onclick="goToPage(${pag.page + 1})">Next <i class="bi bi-chevron-right"></i></button>`;
        bar.innerHTML = html;
    }

    function goToPage(p) {
        loadMedia(p);
    }

    function openPlayer(rawJson) {
        const m = JSON.parse(decodeURIComponent(rawJson));
        const body = document.getElementById('playerBody');
        document.getElementById('playerTitle').innerText = m.filename;
        document.getElementById('playerMeta').innerText = `${m.chat} • ${m.sender} • ${m.timestamp || ''}`;
        document.getElementById('playerDownloadBtn').href = m.stream_url;

        if (m.type === 'video') {
            body.innerHTML = `<video src="${m.stream_url}" controls autoplay class="w-100 h-100" style="max-height:75vh; outline:none;"></video>`;
        } else if (m.type === 'image') {
            body.innerHTML = `<img src="${m.stream_url}" class="img-fluid" style="max-height:75vh;">`;
        } else {
            body.innerHTML = `<audio src="${m.stream_url}" controls autoplay class="w-75"></audio>`;
        }
        modal.show();
    }

    document.getElementById('playerModal').addEventListener('hidden.bs.modal', () => {
        document.getElementById('playerBody').innerHTML = '';
    });

    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') goToPage(1);
    });

    loadStats();
    loadMedia(1);
    setInterval(loadStats, 10000);
</script>
</body>
</html>
